[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraperunner"
version = "0.1.0"
description = "Universal website crawler: links, images, text and structured catalogue items from any site, with a real-Chrome fallback"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
scraperunner = "scraperunner.cli:main"
scraperunner-web = "scraperunner.web.__main__:main"

[tool.setuptools.packages.find]
include = ["scraperunner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
